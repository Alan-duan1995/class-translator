name: Publish v0.7.4 recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.7.4-recovery.yml']
concurrency:
  group: release-v0.7.4-recovery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stop-queued-run:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh api --method POST repos/$GH_REPO/actions/runs/38423730279/cancel || true
  mac:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f11f1c239d2f416facb9dae652196ec26c70212b
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run helpers
      - run: npm run vendor
      - run: npm run models
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npx electron-builder --mac --publish never
      - run: node scripts/check-package.mjs
      - name: Verify Mac installers
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            image="dist/ClassTranslator-0.7.4-${arch}.dmg"
            hdiutil verify "$image"
            mount="$RUNNER_TEMP/verify-$arch"
            mkdir -p "$mount"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$image"
            trap 'hdiutil detach "$mount" || true' EXIT
            app="$mount/课堂同传.app"
            expected=arm64
            if [ "$arch" = x64 ]; then expected=x86_64; fi
            test "$(lipo -archs "$app/Contents/MacOS/课堂同传")" = "$expected"
            codesign --verify --deep --strict "$app"
            hdiutil detach "$mount"
            trap - EXIT
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-installers-v0.7.4
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mac-installers-v0.7.4
          path: installers
      - name: Check Windows source
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/38423730279 --jq '.head_sha')" = f11f1c239d2f416facb9dae652196ec26c70212b
          test "$(gh api repos/$GH_REPO/actions/runs/38423730279/jobs --jq '.jobs[] | select(.name == "windows") | .conclusion')" = success
      - uses: actions/download-artifact@v4
        with:
          name: Windows-installers-v0.7.4
          path: installers
          run-id: 38423730279
          github-token: ${{ github.token }}
      - name: Verify installers and prepare notes
        shell: bash
        run: |
          set -euo pipefail
          for file in ClassTranslator-0.7.4-arm64.dmg ClassTranslator-0.7.4-x64.dmg ClassTranslator-0.7.4-win-x64-setup.exe ClassTranslator-0.7.4-win-arm64-setup.exe; do
            test -s "installers/$file"
          done
          (cd installers && sha256sum *.dmg *.exe > SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          新增 **App 内更新下载、录制防睡眠、音量条和连接状态提示**。

          - 自动选择系统和架构下载更新，校验 SHA-256；结束录制与精讲后才允许打开安装包，不会静默安装或强制重启。
          - 录制及精讲期间阻止自动睡眠，任务结束后释放；不保证合盖或手动睡眠时录音。
          - 显示实际输入音量，以及 Deepgram 的连接、重连和停止状态；断线音频不会自动补转写。
          - 同步使用说明、隐私说明和模型额度提示。
          - Mac / Windows 的 arm64、x64 四个安装包全部从本次源码重新构建。

          Windows 保留原安装 GUID，支持覆盖安装。Mac 应用标识更改后可能需要重新授予麦克风和系统音频权限；课堂记录及设置目录名称不变。

          Mac 苹果芯片选 arm64.dmg，Intel 选 x64.dmg；Windows Intel/AMD 选 win-x64-setup.exe，ARM 选 win-arm64-setup.exe。软件没有商业代码签名/Apple 公证，首次打开请参照 README。

          自动构建执行测试及包内容检查；Mac 额外检查镜像、架构与 ad-hoc 签名。尚未使用真实 Key 验证所有云端服务，也未完成所有目标系统的人工升级测试。
          NOTES
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.7.4 --json isDraft > existing.json 2>/dev/null; then
            test "$(jq -r '.isDraft' existing.json)" = true || { echo 'Already published; refusing overwrite'; exit 1; }
          else
            gh release create v0.7.4 --target f11f1c239d2f416facb9dae652196ec26c70212b --draft --title '课堂同传 v0.7.4 · 更新下载与录制体验优化' --notes-file release-notes.md
          fi
          gh release upload v0.7.4 installers/*.dmg installers/*.exe installers/SHA256SUMS.txt --clobber
          test "$(gh release view v0.7.4 --json assets --jq '[.assets[] | select(.name | test("\\.(dmg|exe)$"))] | length')" = 4
          gh release edit v0.7.4 --draft=false --latest --notes-file release-notes.md
